[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-rted"
version = "0.1.0"
description = "Normally referenced relation-time evidence distillation for ReactVAU"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "transformers==4.47.1", "peft==0.12.0", "safetensors>=0.4", "torchvision>=0.19", "einops>=0.8", "timm>=1", "psutil>=5.9", "sentencepiece>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nc_rted*"]
